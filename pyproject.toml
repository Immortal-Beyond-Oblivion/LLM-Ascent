[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-ascent"
version = "0.1.0"
description = "An iterative small-language-model course project."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
]

[project.optional-dependencies]
plots = [
    "numpy",
    "matplotlib",
]

[tool.setuptools.packages.find]
include = ["src*"]
